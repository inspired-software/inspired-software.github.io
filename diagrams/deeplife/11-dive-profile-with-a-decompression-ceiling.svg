<svg viewBox="0 0 480 290" role="img" aria-label="Dive profile with a decompression ceiling rising through the ascent, a stop at six metres, and a bar beneath showing the surface interval and no-fly countdown.">
          <defs>
            <linearGradient id="deco-fill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-opacity=".3" style="stop-color:var(--cyan)"/>
              <stop offset="100%" stop-opacity="0" style="stop-color:var(--cyan)"/>
            </linearGradient>
          </defs>
          <g font-family="ui-sans-serif,system-ui">
            <g stroke="currentColor" stroke-opacity=".12">
              <path d="M44 34h422M44 78h422M44 122h422M44 166h422M44 210h422"/>
            </g>
            <g fill="currentColor" fill-opacity=".5" font-size="9.5" text-anchor="end">
              <text x="38" y="38">0 m</text>
              <text x="38" y="82">10</text>
              <text x="38" y="126">20</text>
              <text x="38" y="170">30</text>
              <text x="38" y="214">40</text>
            </g>

            <path d="M44 34 L92 201 L160 205 L226 194 L268 188 L300 140 L336 104 L364 60 L410 60 L440 34 L440 34 L44 34 Z"
                  fill="url(#deco-fill)"/>
            <path d="M44 34 L92 201 L160 205 L226 194 L268 188 L300 140 L336 104 L364 60 L410 60 L440 34"
                  fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" style="stroke:var(--cyan)"/>

            <path d="M250 96 L300 84 L340 70 L378 56 L412 47"
                  fill="none" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round" style="stroke:var(--sun)"/>
            <text x="256" y="88" fill-opacity=".9" font-size="9.5" style="fill:var(--sun)">ceiling</text>

            <circle cx="318" cy="122" r="4.5" style="fill:var(--coral)"/>
            <text x="328" y="118" fill-opacity=".9" font-size="9.5" style="fill:var(--coral)">ascent too fast</text>

            <text x="387" y="76" text-anchor="middle" fill="currentColor" fill-opacity=".6" font-size="9.5">stop at 6 m</text>
            <text x="150" y="228" fill="currentColor" fill-opacity=".5" font-size="9.5">tissue state saved on every reading</text>

            <rect x="44" y="244" width="422" height="8" rx="4" fill="currentColor" fill-opacity=".08"/>
            <rect x="44" y="244" width="180" height="8" rx="4" fill-opacity=".45" style="fill:var(--kelp)"/>
            <rect x="224" y="244" width="242" height="8" rx="4" fill-opacity=".35" style="fill:var(--sun)"/>
            <text x="134" y="270" text-anchor="middle" fill="currentColor" fill-opacity=".55" font-size="9.5">surface interval</text>
            <text x="345" y="270" text-anchor="middle" fill="currentColor" fill-opacity=".55" font-size="9.5">tissue-based no-fly countdown</text>
          </g>
        </svg>

<svg viewBox="0 0 480 300" role="img" aria-label="Diagram: your devices mirror to the private half of your own iCloud, a shared dive gets a compartment of its own, and a buddy&rsquo;s device mirrors that compartment but cannot write to it.">
          <g font-family="ui-sans-serif,system-ui">
            <rect x="24" y="18" width="190" height="64" rx="12" fill-opacity=".1" stroke-opacity=".45" style="fill:var(--cyan);stroke:var(--cyan)"/>
            <text x="119" y="44" text-anchor="middle" fill="currentColor" font-weight="620" font-size="11.5">Your iCloud</text>
            <text x="119" y="62" text-anchor="middle" fill="currentColor" fill-opacity=".55" font-size="10">the private half, yours alone</text>

            <rect x="266" y="18" width="190" height="64" rx="12" fill-opacity=".1" stroke-opacity=".45" style="fill:var(--coral);stroke:var(--coral)"/>
            <text x="361" y="44" text-anchor="middle" fill="currentColor" font-weight="620" font-size="11.5">A shared dive</text>
            <text x="361" y="62" text-anchor="middle" fill="currentColor" fill-opacity=".55" font-size="10">its own compartment, one per dive</text>

            <rect x="24" y="186" width="190" height="76" rx="12" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".18"/>
            <text x="119" y="212" text-anchor="middle" fill="currentColor" font-weight="620" font-size="11.5">Your devices</text>
            <text x="119" y="230" text-anchor="middle" fill="currentColor" fill-opacity=".55" font-size="9.5">iPhone &middot; iPad &middot; Mac &middot; Vision Pro</text>
            <text x="119" y="246" text-anchor="middle" fill="currentColor" fill-opacity=".55" font-size="9.5">Apple TV &middot; Apple Watch</text>

            <rect x="266" y="186" width="190" height="76" rx="12" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".18"/>
            <text x="361" y="212" text-anchor="middle" fill="currentColor" font-weight="620" font-size="11.5">A buddy&rsquo;s device</text>
            <text x="361" y="234" text-anchor="middle" fill-opacity=".9" font-size="10" style="fill:var(--coral)">can look, cannot edit</text>

            <g stroke-opacity=".5" stroke-width="1.5" fill="none" style="stroke:var(--cyan)">
              <path d="M119 86 V182"/>
            </g>
            <path d="M115 88 l4 -10 4 10 z" fill-opacity=".7" style="fill:var(--cyan)"/>
            <path d="M115 180 l4 10 4 -10 z" fill-opacity=".7" style="fill:var(--cyan)"/>
            <text x="130" y="126" fill="currentColor" fill-opacity=".55" font-size="9.5">dives</text>
            <text x="130" y="142" fill="currentColor" fill-opacity=".55" font-size="9.5">+ photographs</text>

            <g stroke-opacity=".5" stroke-width="1.5" fill="none" style="stroke:var(--coral)">
              <path d="M361 86 V182"/>
            </g>
            <path d="M357 180 l4 10 4 -10 z" fill-opacity=".7" style="fill:var(--coral)"/>
            <text x="372" y="134" fill="currentColor" fill-opacity=".55" font-size="9.5">mirrors down</text>

            <g stroke="currentColor" stroke-opacity=".3" stroke-width="1.4" fill="none">
              <path d="M214 50 H260"/>
            </g>
            <path d="M258 46 l10 4 -10 4 z" fill="currentColor" fill-opacity=".35"/>
            <text x="240" y="38" text-anchor="middle" fill="currentColor" fill-opacity=".5" font-size="9.5">share a dive</text>

            <text x="240" y="288" text-anchor="middle" fill="currentColor" fill-opacity=".5" font-size="10">one file on every device, with the photographs beside it</text>
          </g>
        </svg>

              <path d="M46 250 C 120 232 150 194 190 164 C 240 128 270 96 320 66 C 355 46 380 36 414 26"/>
              <path d="M46 250 C 100 244 140 216 180 190 C 235 154 262 120 310 90 C 350 64 380 42 414 26"/>

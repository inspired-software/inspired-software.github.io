<svg viewBox="0 0 480 300" style="width:100%;max-width:460px;margin-inline:auto" role="img"
             aria-label="Illustration: a kelp-fringed reef shelf ends at a wall that fades away into open water, and a diver hangs in the blue past the edge, marked as where you are.">
          <defs>
            <radialGradient id="lost-glow" cx="50%" cy="45%" r="55%">
              <stop offset="0%" stop-opacity=".16" style="stop-color:var(--cyan)"/>
              <stop offset="100%" stop-opacity="0" style="stop-color:var(--cyan)"/>
            </radialGradient>
            <linearGradient id="lost-rock" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="currentColor" stop-opacity=".17"/>
              <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="lost-fade-v" x1="0" y1="0" x2="0" y2="1">
              <stop offset="28%" stop-color="#FFFFFF"/>
              <stop offset="100%" stop-color="#000000"/>
            </linearGradient>
            <linearGradient id="lost-fade-h" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#000000"/>
              <stop offset="16%" stop-color="#000000" stop-opacity="0"/>
            </linearGradient>
            <mask id="lost-mask">
              <rect x="0" y="0" width="480" height="300" fill="url(#lost-fade-v)"/>
              <rect x="0" y="0" width="480" height="300" fill="url(#lost-fade-h)"/>
            </mask>
          </defs>

          <ellipse cx="330" cy="150" rx="168" ry="126" fill="url(#lost-glow)"/>

          <!-- the wall: a shelf that stops, and a face that keeps going -->
          <g mask="url(#lost-mask)">
            <path d="M0 300 L0 119 C30 113 58 121 88 118 C108 116 126 126 142 134 L172 300 Z"
                  fill="url(#lost-rock)"/>
            <path d="M0 119 C30 113 58 121 88 118 C108 116 126 126 142 134 L172 300" fill="none"
                  stroke="currentColor" stroke-opacity=".32" stroke-width="1.5" stroke-linejoin="round"/>
            <g fill="none" stroke="currentColor" stroke-opacity=".13" stroke-width="1.2">
              <path d="M4 140 Q76 146 145 159"/>
              <path d="M4 178 Q78 184 151 197"/>
              <path d="M4 216 Q80 222 157 235"/>
            </g>
          </g>

          <!-- growth on the lip -->
          <g fill="none" stroke-linecap="round" stroke-width="2">
            <g stroke-opacity=".5" style="stroke:var(--kelp)">
              <path d="M26 116 C22 105 30 99 27 90"/>
              <path d="M48 118 C44 108 52 102 49 94"/>
              <path d="M118 127 C114 118 122 113 119 106"/>
            </g>
            <g stroke-opacity=".42" stroke-width="1.6" style="stroke:var(--coral)">
              <path d="M86 120 L78 105M86 120 L83 101M86 120 L90 101M86 120 L95 106"/>
              <path d="M76 107 Q86 97 97 108"/>
            </g>
          </g>

          <!-- marine snow -->
          <g fill="currentColor" fill-opacity=".16">
            <circle cx="232" cy="72" r="1.6"/><circle cx="286" cy="108" r="1.2"/>
            <circle cx="410" cy="94" r="1.7"/><circle cx="352" cy="222" r="1.4"/>
            <circle cx="252" cy="246" r="1.2"/><circle cx="440" cy="188" r="1.5"/>
            <circle cx="308" cy="58" r="1.1"/><circle cx="196" cy="196" r="1.3"/>
          </g>

          <!-- a diver in mid-water, nothing underneath -->
          <g transform="translate(378 146) rotate(6)">
            <g fill="currentColor" fill-opacity=".6">
              <path d="M-64 12 L-86 3 L-90 13 L-66 18 Z"/>
              <path d="M-66 17 L-88 16 L-84 27 L-64 22 Z"/>
              <path d="M-2 -4.5 Q-22 -2 -36 5 Q-50 9 -64 13.5 L-64 18.5 Q-50 15.5 -36 15 Q-22 10 -2 10 Z"/>
              <rect x="-30" y="-8.5" width="22" height="8.5" rx="4.25" transform="rotate(-16 -19 -4.25)"/>
              <path d="M-4 5 L8 10" fill="none" stroke="currentColor" stroke-opacity=".6"
                    stroke-width="5.5" stroke-linecap="round"/>
              <circle cx="6" cy="0" r="7.5"/>
            </g>
            <rect x="7" y="-4" width="6.5" height="6" rx="2" fill-opacity=".5" style="fill:var(--cyan)"/>
            <!-- exhaust, going up without you -->
            <g fill-opacity=".45" style="fill:var(--cyan)">
              <circle cx="10" cy="-17" r="2.4"/>
              <circle cx="5" cy="-32" r="1.8"/>
              <circle cx="-1" cy="-47" r="1.3"/>
            </g>
          </g>

          <g stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="3 3" style="stroke:var(--coral)">
            <path d="M344 178 L338 196"/>
          </g>
          <text x="338" y="216" text-anchor="middle" font-size="12.5" font-family="ui-sans-serif,system-ui" style="fill:var(--coral)">you are here</text>
        </svg>

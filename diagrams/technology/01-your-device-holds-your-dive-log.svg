<svg viewBox="0 0 480 300" role="img" aria-label="Your device holds your dive log and your photographs, and syncs both directly with your own iCloud account: your personal log in one direction, dives shared with you in the other. Nothing passes through Inspired Software.">
          <defs>
            <marker id="sync-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 Z" fill="currentColor" fill-opacity=".45"/>
            </marker>
          </defs>
          <g font-family="ui-sans-serif,system-ui" font-size="12">
            <rect x="8" y="10" width="188" height="228" rx="14" fill="currentColor" fill-opacity=".03"
                  stroke="currentColor" stroke-opacity=".16" stroke-dasharray="5 4"/>
            <text x="102" y="34" text-anchor="middle" fill="currentColor" font-weight="620">Your device</text>

            <rect x="24" y="48" width="156" height="62" rx="10" fill-opacity=".13" stroke-opacity=".5" style="fill:var(--cyan);stroke:var(--cyan)"/>
            <text x="102" y="72" text-anchor="middle" fill="currentColor" font-size="11">Your dive log</text>
            <text x="102" y="90" text-anchor="middle" fill="currentColor" fill-opacity=".6" font-size="10">dives &middot; edits &middot; tags &middot; ratings</text>

            <rect x="24" y="122" width="156" height="62" rx="10" fill-opacity=".11" stroke-opacity=".45" style="fill:var(--kelp);stroke:var(--kelp)"/>
            <text x="102" y="146" text-anchor="middle" fill="currentColor" font-size="11">Your photographs</text>
            <text x="102" y="164" text-anchor="middle" fill="currentColor" fill-opacity=".6" font-size="10">the original files</text>

            <text x="102" y="208" text-anchor="middle" fill="currentColor" fill-opacity=".55" font-size="10">the real copy &mdash;</text>
            <text x="102" y="222" text-anchor="middle" fill="currentColor" fill-opacity=".55" font-size="10">readable with no signal</text>

            <rect x="284" y="10" width="188" height="228" rx="14" fill="currentColor" fill-opacity=".03"
                  stroke="currentColor" stroke-opacity=".16" stroke-dasharray="5 4"/>
            <text x="378" y="34" text-anchor="middle" fill="currentColor" font-weight="620">Your iCloud</text>

            <rect x="300" y="48" width="156" height="62" rx="10" fill="currentColor" fill-opacity=".06" stroke="currentColor" stroke-opacity=".22"/>
            <text x="378" y="72" text-anchor="middle" fill="currentColor" font-size="11">Your private storage</text>
            <text x="378" y="90" text-anchor="middle" fill="currentColor" fill-opacity=".6" font-size="10">your personal log</text>

            <rect x="300" y="122" width="156" height="62" rx="10" fill="currentColor" fill-opacity=".06" stroke="currentColor" stroke-opacity=".22"/>
            <text x="378" y="146" text-anchor="middle" fill="currentColor" font-size="11">Dives shared with you</text>
            <text x="378" y="164" text-anchor="middle" fill="currentColor" fill-opacity=".6" font-size="10">read-only, from other divers</text>

            <text x="378" y="208" text-anchor="middle" fill="currentColor" fill-opacity=".55" font-size="10">your account, not ours &mdash;</text>
            <text x="378" y="222" text-anchor="middle" fill="currentColor" fill-opacity=".55" font-size="10">we run no servers</text>

            <g stroke="currentColor" stroke-opacity=".45" stroke-width="1.4" fill="none">
              <path d="M202 79 H278" marker-start="url(#sync-arrow)" marker-end="url(#sync-arrow)"/>
              <path d="M202 153 H278" marker-start="url(#sync-arrow)" marker-end="url(#sync-arrow)"/>
            </g>
            <text x="240" y="68" text-anchor="middle" font-size="10" font-weight="600" style="fill:var(--cyan)">your log</text>
            <text x="240" y="142" text-anchor="middle" font-size="10" font-weight="600" style="fill:var(--coral)">shared dives</text>

            <rect x="8" y="252" width="464" height="38" rx="11" fill="currentColor" fill-opacity=".04" stroke="currentColor" stroke-opacity=".12"/>
            <text x="240" y="276" text-anchor="middle" fill="currentColor" fill-opacity=".68" font-size="10.5">no account to create &middot; nothing of ours in the middle &middot; nothing we can read</text>
          </g>
        </svg>
